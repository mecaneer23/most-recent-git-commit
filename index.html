<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Recent Git Commit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script>
        function getRelativeTime(timestamp) {
            const DAY_MILLISECONDS = 1000 * 60 * 60 * 24;
            const rtf = new Intl.RelativeTimeFormat("en", {
                numeric: "auto",
            });
            const daysDifference = Math.round(
                (timestamp - new Date().getTime()) / DAY_MILLISECONDS,
            );

            return rtf.format(daysDifference, "day");
        }
        const NULL_SHA = "0000000000000000000000000000000000000000";

        function fallback(reason) {
            console.warn("[MostRecentGitCommit] FALLBACK:", reason);
            return {
                repo: "—",
                message: "Unable to load commits. " + reason,
                date: new Date().toISOString(),
                url: "https://github.com",
                sha: "—",
            };
        }

        async function apiFetch(url) {
            const useProxy = location.protocol === "file:";
            const proxy = "https://corsproxy.io/?url=" + encodeURIComponent(url);
            let res = useProxy
                ? await fetch(proxy)
                : await fetch(url, {
                      headers: {
                          "User-Agent":
                              "MostRecentGitCommit (https://github.com/mecaneer23/most-recent-git-commit)",
                      },
                  });
            if (!useProxy && res.status === 0) res = await fetch(proxy);
            if (!res.ok) throw new Error("API " + res.status + " " + (res.statusText || ""));
            try {
                return await res.json();
            } catch {
                throw new Error("INVALID_JSON");
            }
        }

        async function getMostRecentCommit(user) {
            const u = String(user ?? "").trim();
            if (!u) return fallback("No username provided.");
            try {
                const events = await apiFetch(
                    "https://api.github.com/users/" + encodeURIComponent(u) + "/events/public"
                );
                if (!Array.isArray(events) || events.length === 0) {
                    return fallback("No public events for this user.");
                }
                const push = events.find(
                    (e) =>
                        e.type === "PushEvent" &&
                        e.repo?.name &&
                        e.payload?.head &&
                        e.payload.head !== NULL_SHA
                );
                if (!push) return fallback("No push events with commits found.");

                const repo = push.repo.name;
                const sha = push.payload.head;
                const c = await apiFetch(
                    "https://api.github.com/repos/" + repo + "/commits/" + sha
                );
                return {
                    repo: repo.split("/")[1],
                    message: c.commit.message || "(no message)",
                    date: c.commit.author.date,
                    url: c.html_url,
                    sha: c.sha.slice(0, 7),
                };
            } catch (e) {
                if (e.message === "INVALID_JSON") return fallback("Invalid response (not JSON).");
                if (e.message?.startsWith("API ")) {
                    return fallback("API error " + e.message.slice(4));
                }
                return fallback("Network error: " + (e.message || String(e)));
            }
        }
    </script>
    <a href="https://github.com/mecaneer23/most-recent-git-commit" class="github-corner"
        aria-label="View source on GitHub"><svg viewBox="0 0 250 250" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path
                d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
                fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path
                d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
                fill="currentColor" class="octo-body"></path>
        </svg>
    </a>
    <div class="container">
        <h1>Enter a GitHub username:</h1>
        <form action="javascript:populate_card()">
            <label for="username"></label>
            <input type="text" id="username" name="username" autofocus>
            <input type="submit" value="Submit">
        </form>
        <div class="card">
            <h2 class="title">Most recent commit was in <a class="link" href=""></a></h2>
            <h3 class="subtitle">Subtitle Here</h3>
            <p class="date">Date Here</p>
            <a href="#" class="url">URL Here</a>
        </div>
    </div>
    <script>
        async function populate_card() {
            const params = new URLSearchParams(window.location.search);
            const user = params.has("user") ? params.get("user") : document.querySelector("#username").value;
            const data = await getMostRecentCommit(user);
            document.querySelector(".card").style.display = "block";
            document.querySelector(".card .link").innerHTML = data.repo;
            const commitUrl = new URL(data.url);
            const pathPart = commitUrl.pathname.split("/").slice(0, 3).join("/");
            document.querySelector(".card .link").href = pathPart && pathPart !== "//" ? `${commitUrl.protocol}//${commitUrl.host}${pathPart}` : data.url;
            document.querySelector(".card .subtitle").innerHTML = data.message;
            document.querySelector(".card .date").innerHTML = new Date(data.date).toString() + "<br>(" + getRelativeTime(new Date(data.date)) + ")";
            const url = document.querySelector(".card .url");
            url.href = data.url;
            url.innerHTML = data.sha;
            document.querySelector("#username").value = "";
        }
        if (new URLSearchParams(window.location.search).has("user")) {
            populate_card();
            document.querySelectorAll("h1, form").forEach(e => e.style.display = "none");
        }
    </script>
</body>

</html>
